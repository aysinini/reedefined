<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reedefined — Issue No. 1 · May 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#0C0C0C;--mid:#3A3A3A;--muted:#777;--light:#AAA;
  --rule:#E0E0E0;--bg:#F8F7F4;--white:#FFF;
  --teal:#4A6670;--teal-l:#D8E4E8;--teal-ll:#EEF3F5;
  --red:#C8251A;--gold:#4A6670;
  --H:'Libre Baskerville',Georgia,serif;
  --P:'Playfair Display',Georgia,serif;
  --C:'Barlow Condensed',sans-serif;
  --S:'Barlow',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#111}
body{font-family:var(--S);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

/* ── READER CHROME ── */
.reader-bar {
  height:48px;background:rgba(28,32,42,.97);border-bottom:1px solid #3a3e4e;
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  flex-shrink:0;z-index:100;
}
.rb-logo{font-family:var(--H);font-size:20px;font-weight:700;color:#fff;letter-spacing:-.2px;cursor:pointer}
.rb-info{display:flex;align-items:center;gap:16px}
.rb-issue{font-family:var(--C);font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4)}
.rb-page{font-family:var(--H);font-size:14px;font-style:italic;color:rgba(255,255,255,.5)}
.rb-controls{display:flex;align-items:center;gap:8px}
.rb-btn{font-family:var(--C);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:7px 16px;border:1px solid #3a3e4e;background:none;color:rgba(255,255,255,.5);cursor:pointer;transition:all .15s;border-radius:20px}
.rb-btn:hover,.rb-btn.on{color:#fff;border-color:#888}
.rb-sep{width:1px;height:18px;background:#3a3e4e}
.rb-close{font-size:16px;color:rgba(255,255,255,.4);background:none;border:none;cursor:pointer;padding:6px 10px;transition:color .15s;margin-left:4px}
.rb-close:hover{color:#fff}

/* ── PROGRESS ── */
.reader-prog{height:2px;background:#1a1a1a;flex-shrink:0}
.reader-prog-fill{height:100%;background:var(--teal);transition:width .4s cubic-bezier(.16,1,.3,1)}

/* ── STAGE ── */
.stage {
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:24px 32px;position:relative;overflow:hidden;
  perspective:2000px;
}

/* ── BOOK ── */
.book {
  width:100%;max-width:1320px;height:100%;max-height:740px;
  display:flex;position:relative;
  filter:drop-shadow(0 20px 60px rgba(0,0,0,.35)) drop-shadow(0 4px 16px rgba(0,0,0,.2));
}

/* ── PAGE ── */
.page-wrap {
  flex:1;position:relative;height:100%;
  transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.645,.045,.355,1);
  transform-origin:right center;
}
.page-wrap.flipped { transform:rotateY(-180deg); }

.page-front,.page-back {
  position:absolute;inset:0;
  backface-visibility:hidden;
  overflow:hidden;
}
.page-back { transform:rotateY(180deg); }

/* Shadow on spine */
.spine {
  width:14px;background:linear-gradient(to right,#1a1e2a,#2e3450,#1a1e2a);
  flex-shrink:0;align-self:stretch;
}

/* ── NAV ARROWS ── */
.nav-arrow {
  position:absolute;top:50%;transform:translateY(-50%);
  width:40px;height:40px;border:1px solid #3a3e4e;
  background:rgba(28,32,42,.7);color:rgba(255,255,255,.6);
  font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;z-index:50;border-radius:50%;
}
.nav-arrow:hover{background:rgba(28,32,42,.95);color:#fff;border-color:#666}
.nav-arrow:disabled{opacity:.1;cursor:default}
.nav-prev{left:4px}.nav-next{right:4px}

/* ── PAGE COUNTER ── */
.page-counter {
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  font-family:var(--C);font-size:11px;letter-spacing:2px;
  color:rgba(255,255,255,.35);background:rgba(0,0,0,.5);
  padding:5px 16px;pointer-events:none;border-radius:20px;
}

/* ═══════════════════════════════════════════
   MONOCLE STYLE PAGES
   ═══════════════════════════════════════════ */

/* MONOCLE COVER */
.mono-cover {
  width:100%;height:100%;
  background:#F2F0EB;
  display:flex;flex-direction:column;
  overflow:hidden;position:relative;border-radius:12px 0 0 12px;
}
.mc-top-bar{height:3px;background:var(--ink);border-radius:12px 0 0 0}
.mc-head{
  padding:20px 28px 14px;
  border-bottom:2px solid var(--ink);
  display:flex;align-items:center;justify-content:space-between;
}
.mc-logo{
  font-family:var(--H);font-size:clamp(28px,4vw,46px);font-weight:700;
  color:var(--ink);letter-spacing:-1px;line-height:1;
}
.mc-head-right{text-align:right}
.mc-issue-num{font-family:var(--C);font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.mc-issue-date{font-family:var(--H);font-size:14px;font-style:italic;color:var(--mid);margin-top:3px}
.mc-price{font-family:var(--C);font-size:10px;letter-spacing:1.5px;color:var(--light);margin-top:2px}
.mc-illustration{
  flex:1;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.mc-ill-bg{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 50% 70% at 50% 40%, rgba(74,102,112,.18) 0%, transparent 70%),
    radial-gradient(ellipse 80% 40% at 20% 80%, rgba(74,102,112,.08) 0%, transparent 60%),
    #EBE8E0;
}
.mc-ill-svg{position:relative;z-index:1;width:70%;height:70%}
.mc-cover-label{
  position:absolute;top:20px;left:28px;
  font-family:var(--C);font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:rgba(0,0,0,.25);z-index:2;
}
.mc-tease{
  border-top:2px solid var(--ink);
  padding:16px 28px;
}
.mc-tease-head{font-family:var(--C);font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.mc-tease-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--rule)}
.mc-tease-item{
  background:#F2F0EB;padding:10px 12px;
  cursor:pointer;transition:background .15s;
}
.mc-tease-item:hover{background:var(--teal-ll)}
.mc-tease-cat{font-family:var(--C);font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--teal);margin-bottom:4px}
.mc-tease-title{font-family:var(--H);font-size:11px;font-weight:700;color:var(--ink);line-height:1.3}
.mc-foot{
  padding:8px 28px;background:var(--ink);
  display:flex;align-items:center;justify-content:space-between;
}
.mc-foot-l{font-family:var(--C);font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.35)}
.mc-foot-r{font-family:var(--H);font-size:11px;font-style:italic;color:rgba(255,255,255,.35)}

/* MONOCLE AD */
.mono-ad {
  width:100%;height:100%;
  background:#F2F0EB;
  display:flex;flex-direction:column;
  border-top:3px solid var(--ink);
  position:relative;overflow:hidden;border-radius:0 12px 12px 0;
}
.ma-inner{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px dashed var(--rule);margin:20px;position:relative;
}
.ma-label{font-family:var(--C);font-size:9px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--light);margin-bottom:32px}
.ma-placeholder{font-family:var(--H);font-size:clamp(28px,4vw,56px);font-weight:700;color:rgba(0,0,0,.06);text-align:center;line-height:1;letter-spacing:-1px}
.ma-placeholder em{font-style:italic;font-weight:400}
.ma-sub{font-family:var(--C);font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(0,0,0,.1);margin-top:16px}
.ma-corner{position:absolute;width:20px;height:20px;border-color:var(--rule);border-style:solid}
.ma-corner.tl{top:12px;left:12px;border-width:1px 0 0 1px}
.ma-corner.tr{top:12px;right:12px;border-width:1px 1px 0 0}
.ma-corner.bl{bottom:12px;left:12px;border-width:0 0 1px 1px}
.ma-corner.br{bottom:12px;right:12px;border-width:0 1px 1px 0}
.ma-foot{padding:12px 28px;border-top:1px solid var(--rule);display:flex;justify-content:space-between}
.ma-foot-l{font-family:var(--C);font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--light)}
.ma-foot-r{font-family:var(--C);font-size:9px;letter-spacing:1px;color:var(--light)}

/* MONOCLE CONTENTS */
.mono-contents{
  width:100%;height:100%;background:#F2F0EB;
  display:flex;flex-direction:column;overflow:hidden;border-radius:12px 0 0 12px;
}
.mcc-top{height:3px;background:var(--ink)}
.mcc-head{padding:18px 28px 14px;border-bottom:2px solid var(--ink);display:flex;align-items:baseline;justify-content:space-between}
.mcc-title{font-family:var(--H);font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.5px}
.mcc-issue{font-family:var(--C);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.mcc-body{flex:1;overflow:hidden}
.mcc-row{
  display:grid;grid-template-columns:44px 1fr 36px;
  align-items:center;padding:13px 28px;
  border-bottom:1px solid var(--rule);
  cursor:pointer;transition:background .15s;
}
.mcc-row:hover{background:rgba(74,102,112,.06)}
.mcc-n{font-family:var(--H);font-size:14px;font-style:italic;color:var(--light)}
.mcc-info{}
.mcc-cat{font-family:var(--C);font-size:9px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--teal);margin-bottom:4px}
.mcc-title2{font-family:var(--H);font-size:16px;font-weight:700;color:var(--ink);margin-bottom:2px;line-height:1.25}
.mcc-by{font-family:var(--C);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.mcc-pg{font-family:var(--C);font-size:10px;font-weight:700;letter-spacing:1px;color:var(--light);text-align:right}
.mcc-foot{padding:10px 28px;border-top:2px solid var(--ink);background:var(--ink);display:flex;justify-content:space-between}
.mcc-foot-t{font-family:var(--H);font-size:13px;font-style:italic;color:rgba(255,255,255,.5)}
.mcc-foot-r{font-family:var(--C);font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.25)}

/* MONOCLE ARTICLE */
.mono-article{width:100%;height:100%;background:#F2F0EB;display:flex;flex-direction:column;overflow:hidden}
.ma2-top{height:3px;background:var(--ink)}
.ma2-head{padding:20px 28px 16px;border-bottom:1px solid var(--rule)}
.ma2-eyebrow{font-family:var(--C);font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--teal);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.ma2-eyebrow::before{content:'';width:20px;height:1px;background:var(--teal)}
.ma2-title{font-family:var(--H);font-size:clamp(20px,3vw,36px);font-weight:700;color:var(--ink);line-height:1.1;letter-spacing:-.5px;margin-bottom:10px}
.ma2-dek{font-family:var(--H);font-size:16px;font-style:italic;color:var(--mid);line-height:1.6;margin-bottom:12px}
.ma2-byline{font-family:var(--C);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.ma2-body{flex:1;overflow:hidden;padding:16px 28px 18px;position:relative}
.ma2-rule{height:2px;background:var(--ink);margin-bottom:16px}
.ma2-text{font-family:var(--S);font-size:15px;line-height:1.8;color:var(--mid)}
.ma2-text p{margin-bottom:13px}
.ma2-text p:first-child::first-letter{font-family:var(--H);font-size:56px;font-weight:700;float:left;line-height:.78;margin-right:7px;margin-top:5px;color:var(--ink)}
.ma2-pull{font-family:var(--H);font-size:19px;font-style:italic;color:var(--ink);line-height:1.45;padding-left:16px;border-left:2px solid var(--teal);margin:14px 0}
.ma2-pgn{position:absolute;bottom:8px;font-family:var(--C);font-size:10px;letter-spacing:1px;color:var(--light)}
.ma2-pgn.l{left:28px}.ma2-pgn.r{right:28px}

/* MONOCLE IMAGE */
.mono-img{width:100%;height:100%;background:#E8E4DC;display:flex;flex-direction:column;overflow:hidden}
.mi-top{height:3px;background:var(--ink)}
.mi-img{
  flex:1;
  background:
    radial-gradient(ellipse 60% 80% at 60% 40%,rgba(74,102,112,.2),transparent),
    radial-gradient(ellipse 40% 40% at 20% 70%,rgba(74,102,112,.08),transparent),
    #D8D4CA;
  display:flex;align-items:center;justify-content:center;position:relative;
}
.mi-art-label{
  position:absolute;top:0;left:0;right:0;
  padding:14px 20px;
  font-family:var(--C);font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(0,0,0,.2);
  display:flex;justify-content:space-between;
}
.mi-foot{padding:14px 28px;border-top:2px solid var(--ink);display:flex;justify-content:space-between;align-items:center}
.mi-caption{font-family:var(--H);font-size:13px;font-style:italic;color:var(--mid)}
.mi-credit{font-family:var(--C);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--light)}

/* ── STYLE SWITCHER ── */
.style-switcher {
  position:absolute;top:50%;right:16px;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:6px;z-index:50;
}
.ss-btn {
  font-family:var(--C);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  padding:7px 12px;cursor:pointer;transition:all .2s;
  writing-mode:vertical-rl;text-orientation:mixed;
  background:rgba(0,0,0,.5);color:rgba(255,255,255,.4);border:1px solid #2a2a2a;
}
.ss-btn:hover,.ss-btn.on{background:rgba(255,255,255,.1);color:#fff;border-color:#555}

/* ── THUMBNAILS ── */
.thumbs {
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;z-index:50;
}
.thumb {
  width:32px;height:22px;border:1px solid #2a2a2a;
  cursor:pointer;transition:all .2s;opacity:.4;
  background:#1a1a1a;
}
.thumb:hover,.thumb.on{opacity:1;border-color:#777}

/* ── TRANSITIONS ── */
.page-flip-enter{animation:flipIn .7s cubic-bezier(.645,.045,.355,1) forwards}
.page-flip-exit{animation:flipOut .7s cubic-bezier(.645,.045,.355,1) forwards}
@keyframes flipIn{from{opacity:0;transform:rotateY(-15deg) translateX(30px)}to{opacity:1;transform:none}}
@keyframes flipOut{from{opacity:1;transform:none}to{opacity:0;transform:rotateY(15deg) translateX(-30px)}}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1)}

/* ── COVER R ANIMATION ── */
#ring-outer { transform-origin:200px 200px; animation:spinSlow 28s linear infinite; }
#ring-mid   { transform-origin:200px 200px; animation:spinSlow 18s linear infinite reverse; }
#dots-outer { transform-origin:200px 200px; animation:spinSlow 28s linear infinite; }
#dots-mid   { transform-origin:200px 200px; animation:spinSlow 18s linear infinite reverse; }
#letter-r   { transform-origin:200px 200px; animation:spinVerySlow 60s linear infinite; }
#shimmer-arc{ transform-origin:200px 200px; animation:spinMed 8s linear infinite; }
#orbit-gem  { transform-origin:200px 200px; animation:spinMed 6s linear infinite; }
#orbit-gem2 { transform-origin:200px 200px; animation:spinMed 6s linear infinite reverse; }

@keyframes spinSlow    { from{transform:rotate(0deg)}  to{transform:rotate(360deg)} }
@keyframes spinVerySlow{ from{transform:rotate(0deg)}  to{transform:rotate(360deg)} }
@keyframes spinMed     { from{transform:rotate(0deg)}  to{transform:rotate(360deg)} }

/* Breathing glow on the R */
#letter-r { animation: spinVerySlow 60s linear infinite, breathe 4s ease-in-out infinite alternate; }
@keyframes breathe {
  from { filter: drop-shadow(0 8px 20px rgba(42,62,72,.2)); }
  to   { filter: drop-shadow(0 12px 32px rgba(42,62,72,.38)); }
}
</style>
</head>

<!-- READER BAR -->
<div class="reader-bar">
  <div class="rb-logo" onclick="location.href='user-portal.html'">Reedefined</div>
  <div class="rb-info">
    <span class="rb-issue">Issue No. 1 · May 2026</span>
    <span class="rb-page" id="rb-page">Cover</span>
  </div>
  <div class="rb-controls">
<div class="rb-sep"></div>
    <button class="rb-btn" onclick="location.href='user-portal.html'">← My Portal</button>
    <button class="rb-close" onclick="location.href='user-portal.html'">✕</button>
  </div>
</div>

<!-- PROGRESS -->
<div class="reader-prog"><div class="reader-prog-fill" id="prog-fill" style="width:12%"></div></div>

<!-- STAGE -->
<div class="stage">
  <button class="nav-arrow nav-prev" id="nav-prev" onclick="prevPage()" disabled>‹</button>

  <!-- BOOK -->
  <div class="book">
    <div style="flex:1;height:100%;position:relative;border-radius:12px 0 0 12px;overflow:hidden;box-shadow:-4px 0 24px rgba(0,0,0,.18)" id="page-left"></div>
    <div class="spine"></div>
    <div style="flex:1;height:100%;position:relative;border-radius:0 12px 12px 0;overflow:hidden;box-shadow:4px 0 24px rgba(0,0,0,.18)" id="page-right"></div>
  </div>

  <button class="nav-arrow nav-next" id="nav-next" onclick="nextPage()">›</button>
  <div class="page-counter" id="page-counter">Page 1 of 8</div>
</div>

<script>
// ════════════════════════════════════════════
// DATA
// ════════════════════════════════════════════
const ARTICLES = [
  { cat:'Cinema', title:'All of Us Strangers changed how I think about grief', dek:'"Five stars — and I never give five stars."', by:'Marco R.', byInit:'M', byColor:'#4A6670', body:'<p>Andrew Haigh\'s film arrived quietly, without much fanfare, and then stayed with me for weeks. That is the mark of something real — something that doesn\'t announce itself but simply lands, and then refuses to leave.</p><p>I watched it on a Tuesday in February, alone, with the curtains closed. By the end I was not quite crying but not quite not crying either. There is a scene near the end that I have returned to in my mind almost every day since.</p>', pull:'"The best films don\'t ask for your attention. They take it — quietly, completely, without apology."' },
  { cat:'Fashion', title:'Five pieces from Depop that changed how I dress', dek:'"All second-hand. All better than anything new."', by:'Chloe M.', byInit:'C', byColor:'#8A6A8A', body:'<p>The first piece was a blazer. Oversized, wool, the kind of weight that feels like an argument. I found it at the bottom of a Depop search, mislabelled, badly photographed, sitting on a carpet that needed vacuuming.</p><p>That was eighteen months ago. I have worn it to everything important since. There is something about second-hand clothes that new things can never replicate — they arrive already finished, already lived in, the hard work done by someone else.</p>', pull:'"The best things in your wardrobe should feel like they were always yours."' },
  { cat:'Food', title:'The pasta my grandmother never wrote down', dek:'"Recovered from memory, from smell, from thirty years."', by:'Jana K.', byInit:'J', byColor:'#B8953A', body:'<p>She never used a recipe. That was the whole problem. I watched her make it a hundred times as a child and absorbed nothing useful — only the smell, the rhythm of her hands, the particular sound the pasta made when she tested it against the side of the pan.</p><p>It took me three years and about forty attempts to get it right. The last missing piece was the water — how much of the starchy cooking water she added at the end. More than you think. Always more.</p>', pull:'"The recipes that matter most are the ones that exist only in memory."' },
  { cat:'Music', title:'May playlist: what I actually listened to', dek:'Arooj Aftab, Mk.gee, Sufjan Stevens — five essential tracks.', by:'Marco R.', byInit:'M', byColor:'#4A6670', body:'<p>Every month I tell myself I will listen to new things. Every month I end up back with the same handful of records, the same songs I have been carrying around for years. This month was Sufjan Stevens on the train home, Arooj Aftab in the evenings, Mk.gee when I needed to feel young.</p><p>The playlist below is honest. These are not the things I think I should be listening to. They are the things I actually put on.</p>', pull:'"The music you return to is always more interesting than the music you discover."' },
];

const PAGES_MONO = [
  { id:'m-cover', label:'Cover', left:'cover-mono', right:'ad-mono' },
  { id:'m-contents', label:'Contents', left:'contents-mono', right:'article-0-mono' },
  { id:'m-art1', label:'Cinema', left:'img-0-mono', right:'article-1-mono' },
  { id:'m-art2', label:'Food', left:'article-2-mono', right:'article-3-mono' },
];

let style = 'mono';
let cur = 0;

function getPages(){ return PAGES_MONO; }

// ════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════
function render(){
  const pages = getPages();
  const pg = pages[cur];
  const L = document.getElementById('page-left');
  const R = document.getElementById('page-right');

  L.innerHTML = buildPage(pg.left);
  R.innerHTML = buildPage(pg.right);

  // Animate
  [L,R].forEach(el=>{
    el.style.animation='none';
    el.offsetHeight;
    el.style.animation='flipIn .5s cubic-bezier(.16,1,.3,1) forwards';
  });

  // UI
  document.getElementById('rb-page').textContent = pg.label;
  document.getElementById('page-counter').textContent = `Spread ${cur+1} of ${pages.length}`;
  document.getElementById('nav-prev').disabled = cur===0;
  document.getElementById('nav-next').disabled = cur>=pages.length-1;
  document.getElementById('prog-fill').style.width = ((cur+1)/pages.length*100)+'%';
}

function buildPage(id){
  if(id.startsWith('cover-')) return monoCover();
  if(id.startsWith('ad-')) return monoAd();
  if(id.startsWith('contents-')) return monoContents();
  if(id.startsWith('img-')){ const i=parseInt(id.split('-')[1]); return monoImg(i); }
  if(id.startsWith('article-')){ const i=parseInt(id.split('-')[1]); return monoArticle(i); }
  return '<div style="width:100%;height:100%;background:#fff"></div>';
}

// ════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════
function nextPage(){
  const pages = getPages();
  if(cur < pages.length-1){ cur++; render(); }
}
function prevPage(){
  if(cur > 0){ cur--; render(); }
}
function goArticle(i){
  cur = Math.min(1+Math.floor(i/2), getPages().length-1);
  render();
}
function setStyle(s){ style=s; cur=0; render(); }

// Keyboard
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') nextPage();
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') prevPage();
  if(e.key==='Escape') location.href='user-portal.html';
});

// Touch/swipe
let tx=0;
document.querySelector('.stage').addEventListener('touchstart',e=>{ tx=e.touches[0].clientX; });
document.querySelector('.stage').addEventListener('touchend',e=>{
  const d = tx - e.changedTouches[0].clientX;
  if(Math.abs(d)>60){ d>0?nextPage():prevPage(); }
});

// CSS animation
const style_tag = document.createElement('style');
style_tag.textContent = '@keyframes flipIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}';
document.head.appendChild(style_tag);

// Init
render();
</script>
