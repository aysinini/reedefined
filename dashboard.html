<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reedefined — My Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="session-storage.js"></script>
<style>
:root{
  --ink:#0C0C0C;--mid:#3A3A3A;--muted:#777;--light:#BBB;
  --rule:#E2E2E2;--bg:#F8F7F4;--white:#FFF;
  --teal:#4A7C3F;--teal-l:#D4DBCA;--red:#C8251A;
  --H:'Libre Baskerville',Georgia,serif;
  --C:'Barlow Condensed',sans-serif;
  --S:'Barlow',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--S);min-height:100vh;-webkit-font-smoothing:antialiased}
.topbar{border-bottom:3px solid var(--ink);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;background:var(--white)}
.tb-logo{font-family:var(--H);font-size:20px;font-weight:700;cursor:pointer}
.tb-links{display:flex;align-items:center;gap:22px}
.tb-link{font-family:var(--C);font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mid);cursor:pointer}
.wrap{max-width:920px;margin:0 auto;padding:48px 24px 100px}
.eyebrow{font-family:var(--C);font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--teal);margin-bottom:10px}
.h1{font-family:var(--H);font-size:34px;font-weight:700;margin-bottom:36px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:0}
.stat-card{background:var(--white);padding:22px 20px;cursor:pointer;transition:background .15s;border-bottom:3px solid transparent}
.stat-card:hover{background:#FAFAF8}
.stat-card.on{background:var(--teal-l);border-bottom:3px solid var(--teal)}
.stat-n{font-family:var(--H);font-size:30px;font-weight:700;color:var(--ink)}
.stat-l{font-family:var(--C);font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:4px}
.stat-card.on .stat-l{color:var(--teal)}
.tab-panel-wrap{border:1px solid var(--rule);border-top:none;padding:8px 24px 8px;margin-bottom:52px}
.art-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.art-row:last-child{border-bottom:none}
.art-status{font-family:var(--C);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:10px;flex-shrink:0}
.art-status.draft{background:#FAEEDA;color:#854F0B}
.art-status.submitted{background:var(--teal-l);color:var(--teal)}
.art-t{font-family:var(--H);font-size:17px;font-weight:700;flex:1}
.art-cat{font-family:var(--C);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);flex-shrink:0}
.follow-row{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.follow-row:last-child{border-bottom:none}
.follow-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--teal-l);display:flex;align-items:center;justify-content:center;font-family:var(--H);font-size:15px;color:var(--teal);flex-shrink:0}
.follow-name{font-family:var(--H);font-size:16px;font-weight:700}
.empty{padding:32px 0;text-align:center;color:var(--muted);font-family:var(--H);font-size:15px}
</style>
<script src="i18n.js"></script>
</head>
<body>

<div class="topbar">
  <div class="tb-logo" onclick="goHome()">Reedefined</div>
  <div class="tb-links">
    <div style="display:flex;gap:6px;align-items:center">
      <button class="lang-btn" data-lang="en" onclick="setLang('en')" style="background:none;border:none;font-family:var(--C);font-size:12px;font-weight:600;cursor:pointer;padding:0;color:var(--mid)">EN</button>
      <span style="color:var(--rule)">/</span>
      <button class="lang-btn" data-lang="de" onclick="setLang('de')" style="background:none;border:none;font-family:var(--C);font-size:12px;font-weight:600;cursor:pointer;padding:0;color:var(--mid)">DE</button>
    </div>
    <div style="position:relative">
      <button onclick="toggleNotifMenu()" style="background:none;border:none;cursor:pointer;position:relative;padding:4px;display:flex;align-items:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--mid)" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span id="notif-badge" style="display:none;position:absolute;top:0;right:0;background:#C8251A;color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;align-items:center;justify-content:center;font-family:var(--C);font-weight:700">0</span>
      </button>
      <div id="notif-menu" style="display:none;position:absolute;top:36px;right:0;width:320px;max-height:400px;overflow-y:auto;background:#fff;border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:300"></div>
    </div>
    <span class="tb-link" onclick="location.href='newsstand.html'">Newsstand</span>
    <span class="tb-link" data-i18n="gl.cta" onclick="location.href='editor-portal.html'">Write →</span>
  </div>
</div>

<div class="wrap">
  <div class="eyebrow" data-i18n="dash.eyebrow">— My Dashboard</div>
  <div class="h1" data-i18n="dash.h1">Your writer's desk</div>

  <div class="stats-row">
    <div class="stat-card on" id="tab-published" onclick="showTab('published')"><div class="stat-n" id="stat-published">—</div><div class="stat-l" data-i18n="dash.published">Published</div></div>
    <div class="stat-card" id="tab-drafts" onclick="showTab('drafts')"><div class="stat-n" id="stat-drafts">—</div><div class="stat-l" data-i18n="dash.drafts">Drafts</div></div>
    <div class="stat-card" id="tab-followers" onclick="showTab('followers')"><div class="stat-n" id="stat-followers">—</div><div class="stat-l" data-i18n="dash.followers">Followers</div></div>
    <div class="stat-card" id="tab-following" onclick="showTab('following')"><div class="stat-n" id="stat-following">—</div><div class="stat-l" data-i18n="dash.following">Following</div></div>
  </div>
  <div class="tab-panel-wrap">
    <div id="tab-content"><div class="empty">Loading…</div></div>
  </div>
</div>

<script>
const sb = supabase.createClient('https://gseuejqqwkdjkhxfxxwy.supabase.co','sb_publishable_0Nmw1mwGx__b_jJHLHBDKg__1OAsRuy',{auth:{storage:window.REEDEFINED_AUTH_STORAGE}});

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let DATA = { published:[], drafts:[], followers:[], following:[] };

async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.href='portal.html'; return; }
  const uid = session.user.id;

  const [{ data:articles }, { data:followerRows }, { data:followingRows }] = await Promise.all([
    sb.from('contributions').select('id,title,category,status,updated_at').eq('user_id', uid).order('updated_at',{ascending:false}),
    sb.from('follows').select('user_id').eq('contributor_id', uid),
    sb.from('follows').select('contributor_id').eq('user_id', uid)
  ]);

  DATA.published = (articles||[]).filter(a => a.status==='submitted');
  DATA.drafts = (articles||[]).filter(a => a.status==='draft');

  if(DATA.published.length){
    const pubIds = DATA.published.map(a => a.id);
    const [{ data:likeRows }, { data:commentRows }] = await Promise.all([
      sb.from('likes').select('contribution_id').in('contribution_id', pubIds),
      sb.from('comments').select('contribution_id').in('contribution_id', pubIds)
    ]);
    const likeCounts = {}, commentCounts = {};
    (likeRows||[]).forEach(l => { likeCounts[l.contribution_id] = (likeCounts[l.contribution_id]||0) + 1; });
    (commentRows||[]).forEach(c => { commentCounts[c.contribution_id] = (commentCounts[c.contribution_id]||0) + 1; });
    DATA.published.forEach(a => { a.likeCount = likeCounts[a.id]||0; a.commentCount = commentCounts[a.id]||0; });
  }

  const followerIds = (followerRows||[]).map(r => r.user_id).filter(Boolean);
  const followingIds = (followingRows||[]).map(r => r.contributor_id).filter(Boolean);

  const [{ data:followerProfiles }, { data:followingProfiles }] = await Promise.all([
    followerIds.length ? sb.from('profiles').select('id,name,avatar').in('id', followerIds) : Promise.resolve({data:[]}),
    followingIds.length ? sb.from('profiles').select('id,name,avatar').in('id', followingIds) : Promise.resolve({data:[]})
  ]);

  DATA.followers = followerProfiles || [];
  DATA.following = followingProfiles || [];

  document.getElementById('stat-published').textContent = DATA.published.length;
  document.getElementById('stat-drafts').textContent = DATA.drafts.length;
  document.getElementById('stat-followers').textContent = DATA.followers.length;
  document.getElementById('stat-following').textContent = DATA.following.length;

  showTab('published');
}

function showTab(tab){
  document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('on'));
  document.getElementById('tab-'+tab).classList.add('on');

  const el = document.getElementById('tab-content');

  if(tab==='published' || tab==='drafts'){
    const list = DATA[tab];
    if(list.length===0){ el.innerHTML = `<div class="empty">${tab==='published' ? t('dash.empty_published') : t('dash.empty_drafts')}</div>`; return; }
    el.innerHTML = list.map(a => `
      <div class="art-row" onclick="${a.status==='submitted' ? `location.href='article.html?id=${a.id}'` : `location.href='editor-portal.html'`}">
        <span class="art-status ${a.status}">${a.status==='submitted' ? 'Published' : 'Draft'}</span>
        <span class="art-t">${esc(a.title || 'Untitled')}</span>
        ${a.status==='submitted' ? `
        <span style="display:flex;align-items:center;gap:4px;font-family:var(--C);font-size:12px;color:var(--muted);flex-shrink:0">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6z"/></svg>${a.likeCount||0}
        </span>
        <span style="display:flex;align-items:center;gap:4px;font-family:var(--C);font-size:12px;color:var(--muted);flex-shrink:0">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.38 8.38 0 0 1-4-1L3 20l1-5.5a8.38 8.38 0 0 1-1-4A8.38 8.38 0 0 1 11.5 2a8.5 8.5 0 0 1 8.5 8.5z"/></svg>${a.commentCount||0}
        </span>` : ''}
        <span class="art-cat">${esc(a.category || '')}</span>
      </div>`).join('');
    return;
  }

  const list = DATA[tab];
  if(list.length===0){ el.innerHTML = `<div class="empty">${tab==='followers' ? t('dash.empty_followers') : t('dash.empty_following')}</div>`; return; }
  el.innerHTML = list.map(p => {
    const name = p.name || 'Contributor';
    const initial = name.charAt(0).toUpperCase();
    const avatarHtml = p.avatar
      ? `<img class="follow-avatar" src="${p.avatar}" alt="${esc(name)}">`
      : `<div class="follow-avatar">${initial}</div>`;
    return `
      <div class="follow-row" onclick="location.href='profile.html?id=${p.id}'">
        ${avatarHtml}
        <span class="follow-name">${esc(name)}</span>
      </div>`;
  }).join('');
}

async function loadNotifications(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return;

  const { data:notifs } = await sb.from('notifications')
    .select('id,type,read,created_at,comment_body,actor_id,contribution_id,profiles:actor_id(name,avatar),contributions:contribution_id(title)')
    .eq('user_id', session.user.id)
    .order('created_at', { ascending:false })
    .limit(20);

  const unreadCount = (notifs||[]).filter(n => !n.read).length;
  const badge = document.getElementById('notif-badge');
  if(unreadCount > 0){
    badge.textContent = unreadCount > 9 ? '9+' : unreadCount;
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }

  const menu = document.getElementById('notif-menu');
  if(!notifs || notifs.length===0){
    menu.innerHTML = '<div style="padding:24px;text-align:center;font-family:var(--H);font-size:14px;color:var(--muted)">No notifications yet.</div>';
    return;
  }

  menu.innerHTML = notifs.map(n => {
    const name = n.profiles?.name || 'Someone';
    const initial = name.charAt(0).toUpperCase();
    const avatarHtml = n.profiles?.avatar
      ? `<img src="${n.profiles.avatar}" style="width:32px;height:32px;border-radius:50%;object-fit:cover" onerror="this.outerHTML='<div style=&quot;width:32px;height:32px;border-radius:50%;background:#D4DBCA;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:12px;color:#4A7C3F&quot;>${initial}</div>'">`
      : `<div style="width:32px;height:32px;border-radius:50%;background:var(--teal-l);display:flex;align-items:center;justify-content:center;font-family:var(--H);font-size:12px;color:var(--teal)">${initial}</div>`;
    const actionText = n.type === 'like'
      ? `liked your column "${esc(n.contributions?.title || '')}"`
      : `commented on "${esc(n.contributions?.title || '')}"`;
    return `
      <div style="display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid #F0F0EE;background:${n.read ? 'none' : '#FAFAF5'};cursor:pointer" onclick="location.href='article.html?id=${n.contribution_id}'">
        ${avatarHtml}
        <div style="flex:1">
          <div style="font-family:var(--H);font-size:13px;color:var(--ink)"><strong>${esc(name)}</strong> ${actionText}</div>
          ${n.comment_body ? `<div style="font-family:var(--S);font-size:12px;color:var(--muted);margin-top:2px">"${esc(n.comment_body)}"</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

async function toggleNotifMenu(){
  const menu = document.getElementById('notif-menu');
  const isOpen = menu.style.display === 'block';
  menu.style.display = isOpen ? 'none' : 'block';

  if(!isOpen){
    const { data:{ session } } = await sb.auth.getSession();
    if(session){
      await sb.from('notifications').update({ read:true }).eq('user_id', session.user.id).eq('read', false);
      document.getElementById('notif-badge').style.display = 'none';
    }
  }
}

document.addEventListener('click', e=>{
  const menu = document.getElementById('notif-menu');
  if(menu && menu.style.display==='block' && !menu.contains(e.target) && !e.target.closest('button[onclick="toggleNotifMenu()"]')){
    menu.style.display = 'none';
  }
});

init();
loadNotifications();
</script>

</body>
</html>
