<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reedefined — Edit Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#0C0C0C;--mid:#3A3A3A;--muted:#4A4A4A;--light:#6B6B6B;
  --rule:#E2E2E2;--bg:#F8F7F4;--white:#FFF;
  --teal:#4A7C3F;--teal-l:#D4DBCA;--red:#C8251A;
  --H:'Libre Baskerville',Georgia,serif;
  --C:'Barlow Condensed',sans-serif;
  --S:'Barlow',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--S);min-height:100vh;-webkit-font-smoothing:antialiased}
.topbar{border-bottom:3px solid var(--ink);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;background:var(--white)}
.tb-logo{font-family:var(--H);font-size:20px;font-weight:700;cursor:pointer}
.tb-back{font-family:var(--C);font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mid);cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:56px 24px}
.eyebrow{font-family:var(--C);font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--teal);margin-bottom:10px}
.h1{font-family:var(--H);font-size:30px;font-weight:700;margin-bottom:32px}
.avatar-row{display:flex;align-items:center;gap:24px;margin-bottom:36px}
.avatar-preview{width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--teal-l);border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;font-family:var(--H);font-size:28px;color:var(--teal);flex-shrink:0}
.avatar-actions{display:flex;flex-direction:column;gap:8px}
.btn-upload{font-family:var(--C);font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;background:var(--ink);color:#fff;border:none;border-radius:20px;padding:10px 20px;cursor:pointer}
.upload-hint{font-family:var(--S);font-size:12px;color:var(--muted)}
.field{margin-bottom:24px}
.fl{font-family:var(--C);font-size:14px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--mid);display:block;margin-bottom:8px}
.fi,textarea.fi{width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:6px;font-family:var(--S);font-size:15px;color:var(--ink);background:var(--white)}
textarea.fi{resize:vertical;min-height:100px;line-height:1.5}
.btn-save{font-family:var(--C);font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:var(--teal);color:#fff;border:none;border-radius:24px;padding:14px 28px;cursor:pointer;width:100%}
.btn-save:disabled{opacity:.5;cursor:default}
.status-msg{font-family:var(--H);font-size:14px;margin-top:14px;text-align:center}
.status-msg.ok{color:var(--teal)}
.status-msg.err{color:var(--red)}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-logo" onclick="location.href='index.html'">Reedefined</div>
  <div class="tb-back" onclick="location.href='editor-portal.html'">← Back to Writing</div>
</div>

<div class="wrap">
  <div class="eyebrow">— Your Profile</div>
  <div class="h1">Edit your profile</div>

  <div class="avatar-row">
    <div class="avatar-preview" id="avatar-preview">…</div>
    <div class="avatar-actions">
      <button class="btn-upload" onclick="document.getElementById('avatar-input').click()">Upload Photo</button>
      <input type="file" id="avatar-input" accept="image/*" style="display:none" onchange="handleAvatarUpload(this.files[0])">
      <div class="upload-hint" id="avatar-hint">Square photos work best. Max 8MB.</div>
    </div>
  </div>

  <div class="field">
    <label class="fl">Bio</label>
    <textarea class="fi" id="bio-input" placeholder="A line or two about you — what you write about, your taste, your background."></textarea>
  </div>

  <button class="btn-save" id="save-btn" onclick="saveProfile()">Save Profile</button>
  <div class="status-msg" id="status-msg"></div>
</div>

<script>
const sb = supabase.createClient('https://gseuejqqwkdjkhxfxxwy.supabase.co','sb_publishable_0Nmw1mwGx__b_jJHLHBDKg__1OAsRuy');
let currentAvatarUrl = '';

async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.href='portal.html'; return; }

  const { data:p } = await sb.from('profiles').select('avatar,bio,full_name').eq('id', session.user.id).single();
  const name = p?.full_name || session.user.user_metadata?.full_name || session.user.email || '';
  const initial = name.charAt(0).toUpperCase();

  const preview = document.getElementById('avatar-preview');
  if(p?.avatar){
    currentAvatarUrl = p.avatar;
    preview.innerHTML = `<img src="${p.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
  } else {
    preview.textContent = initial;
  }
  document.getElementById('bio-input').value = p?.bio || '';
}

async function handleAvatarUpload(file){
  if(!file) return;
  if(file.size > 8*1024*1024){ showStatus('Photo is too large (max 8MB).', 'err'); return; }

  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return;

  document.getElementById('avatar-hint').textContent = 'Uploading…';

  const ext = file.name.split('.').pop();
  const path = `avatars/${session.user.id}_${Date.now()}.${ext}`;
  const { error: upErr } = await sb.storage.from('media').upload(path, file, { upsert: true });
  if(upErr){ showStatus('Upload failed. Please try again.', 'err'); document.getElementById('avatar-hint').textContent='Square photos work best. Max 8MB.'; return; }

  const { data:{ publicUrl } } = sb.storage.from('media').getPublicUrl(path);
  currentAvatarUrl = publicUrl;
  document.getElementById('avatar-preview').innerHTML = `<img src="${publicUrl}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
  document.getElementById('avatar-hint').textContent = 'Square photos work best. Max 8MB.';
}

async function saveProfile(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return;
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  const bio = document.getElementById('bio-input').value.trim();
  const { error } = await sb.from('profiles').update({ avatar: currentAvatarUrl, bio }).eq('id', session.user.id);

  btn.disabled = false;
  btn.textContent = 'Save Profile';
  if(error){ showStatus('Something went wrong. Please try again.', 'err'); }
  else { showStatus('Profile saved ✓', 'ok'); }
}

function showStatus(msg, type){
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + type;
}

init();
</script>

</body>
</html>
