<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reedefined — Contributor Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="session-storage.js"></script>
<script src="i18n.js"></script>
<style>
:root{
  --ink:#0C0C0C;--mid:#3A3A3A;--muted:#4A4A4A;--light:#6B6B6B;
  --rule:#E2E2E2;--bg:#F8F7F4;--white:#FFF;
  --teal:#4A7C3F;--teal-l:#D4DBCA;
  --H:'Libre Baskerville',Georgia,serif;
  --C:'Barlow Condensed',sans-serif;
  --S:'Barlow',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--S);min-height:100vh;-webkit-font-smoothing:antialiased}
.topbar{border-bottom:3px solid var(--ink);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;background:var(--white)}
.tb-logo{font-family:var(--H);font-size:20px;font-weight:400;cursor:pointer;letter-spacing:.08em}
.tb-back{font-family:var(--C);font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mid);cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:56px 24px}
.profile-hd{display:flex;align-items:center;gap:24px;margin-bottom:20px}
.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--teal-l);display:flex;align-items:center;justify-content:center;font-family:var(--H);font-size:28px;color:var(--teal);flex-shrink:0}
.p-name{font-family:var(--H);font-size:28px;font-weight:700}
.p-beats{font-family:var(--C);font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.p-bio{font-family:var(--H);font-size:16px;color:var(--mid);line-height:1.6;margin:24px 0 36px;padding-bottom:32px;border-bottom:1px solid var(--rule)}
.arch-h{font-family:var(--C);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink);margin-bottom:20px}
.arch-item{padding:20px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.arch-tag{font-family:var(--C);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.arch-t{font-family:var(--H);font-size:19px;font-weight:700;margin-bottom:6px}
.arch-dek{font-family:var(--S);font-size:14px;color:var(--mid);line-height:1.5}
.empty{padding:48px 0;text-align:center;color:var(--muted);font-family:var(--H);font-size:15px}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-logo" onclick="goHome()">Reedefined</div>
  <div style="display:flex;align-items:center;gap:16px">
    <div style="display:flex;gap:6px;align-items:center">
      <button class="lang-btn" data-lang="en" onclick="setLang('en')" style="background:none;border:none;font-family:var(--C);font-size:12px;font-weight:600;cursor:pointer;padding:0;color:var(--mid)">EN</button>
      <span style="color:var(--rule)">/</span>
      <button class="lang-btn" data-lang="de" onclick="setLang('de')" style="background:none;border:none;font-family:var(--C);font-size:12px;font-weight:600;cursor:pointer;padding:0;color:var(--mid)">DE</button>
    </div>
    <div class="tb-back" onclick="location.href='discover.html'">← Back to Discover</div>
  </div>
</div>

<div class="wrap" id="wrap">
  <div class="empty">Loading profile…</div>
</div>

<script>
const sb = supabase.createClient('https://gseuejqqwkdjkhxfxxwy.supabase.co','sb_publishable_0Nmw1mwGx__b_jJHLHBDKg__1OAsRuy',{auth:{storage:window.REEDEFINED_AUTH_STORAGE}});

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadProfile(){
  const params = new URLSearchParams(location.search);
  const uid = params.get('id');
  const wrap = document.getElementById('wrap');

  if(!uid){ wrap.innerHTML = '<div class="empty">No profile specified.</div>'; return; }

  const { data:p, error } = await sb.from('profiles').select('name,avatar,bio,interests,location').eq('id', uid).single();
  if(error || !p){ wrap.innerHTML = '<div class="empty">This profile could not be found.</div>'; return; }

  const { data:subs } = await sb.from('contributions').select('id,title,tagline,category,updated_at').eq('user_id', uid).eq('status','submitted').order('updated_at', { ascending:false });

  const name = p.name || 'Contributor';
  const initial = name.charAt(0).toUpperCase();
  const avatarHtml = p.avatar
    ? `<img class="avatar" src="${p.avatar}" alt="${esc(name)}" onerror="this.outerHTML='<div class=&quot;avatar&quot;>${initial}</div>'">`
    : `<div class="avatar">${initial}</div>`;

  const beats = (p.interests || (subs||[]).map(s=>s.category).filter(Boolean).join(','))
    .split(',').map(s=>s.trim()).filter(Boolean);
  const beatsHtml = beats.length ? beats.slice(0,4).join(' · ') : '';
  const metaParts = [];
  if(beatsHtml) metaParts.push(beatsHtml);
  if(p.location) metaParts.push(esc(p.location));
  const metaHtml = metaParts.join(' &nbsp;·&nbsp; ');

  const archiveHtml = (subs && subs.length)
    ? subs.map(s => `
        <div class="arch-item" onclick="location.href='article.html?id=${s.id}'">
          <div class="arch-tag">${esc(s.category||'Column')}</div>
          <div class="arch-t">${esc(s.title||'Untitled')}</div>
          ${s.tagline ? `<div class="arch-dek">${esc(s.tagline)}</div>` : ''}
        </div>`).join('')
    : `<div class="empty">${t('profile.empty')}</div>`;

  wrap.innerHTML = `
    <div class="profile-hd">
      ${avatarHtml}
      <div>
        <div class="p-name">${esc(name)}</div>
        ${metaHtml ? `<div class="p-beats">${metaHtml}</div>` : ''}
      </div>
    </div>
    ${p.bio ? `<div class="p-bio">${esc(p.bio)}</div>` : ''}
    <div class="arch-h">${t('profile.archive')}</div>
    ${archiveHtml}
  `;
}

loadProfile();
</script>

</body>
</html>
