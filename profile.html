<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reedefined — Contributor Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="session-storage.js"></script>
<script src="i18n.js"></script>
<style>
:root{
  --ink:#0C0C0C;--mid:#3A3A3A;--muted:#4A4A4A;--light:#6B6B6B;
  --rule:#E2E2E2;--bg:#F8F7F4;--white:#FFF;
  --teal:#4A7C3F;--teal-l:#D4DBCA;
  --H:'Libre Baskerville',Georgia,serif;
  --C:'Barlow Condensed',sans-serif;
  --S:'Barlow',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--S);min-height:100vh;-webkit-font-smoothing:antialiased}
.topbar{border-bottom:3px solid var(--ink);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;background:var(--white)}
.tb-logo{font-family:var(--H);font-size:20px;font-weight:400;cursor:pointer;letter-spacing:.08em}
.tb-back{font-family:var(--C);font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mid);cursor:pointer}
.nav-av{width:32px;height:32px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;font-family:var(--H);font-size:12px;font-weight:700;color:#fff;cursor:pointer}
.profile-menu{background:#fff;border:1px solid rgba(74,124,63,.15);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.12);min-width:210px;overflow:hidden}
.profile-menu-item{display:block;width:100%;text-align:left;padding:14px 20px;background:none;border:none;border-top:1px solid var(--rule);cursor:pointer;font-family:var(--C);font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#3A3A3A;transition:background .15s,color .15s}
.profile-menu-item:first-child{border-top:none}
.profile-menu-item:hover{background:var(--teal-l);color:var(--teal)}
.profile-menu-item.danger{color:#C8251A;margin-top:4px}
.profile-menu-item.danger:hover{background:rgba(200,37,26,.07);color:#C8251A}
.wrap{max-width:720px;margin:0 auto;padding:56px 24px}
.profile-hd{display:flex;align-items:center;gap:24px;margin-bottom:20px}
.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--teal-l);display:flex;align-items:center;justify-content:center;font-family:var(--H);font-size:28px;color:var(--teal);flex-shrink:0}
.p-name{font-family:var(--H);font-size:28px;font-weight:700}
.p-beats{font-family:var(--C);font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.cc-follow{font-family:var(--C);font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal);border:1px solid rgba(74,102,112,.35);border-radius:999px;padding:5px 12px;cursor:pointer;transition:all .15s;background:none;white-space:nowrap;margin-left:auto}
.cc-follow:hover,.cc-follow.on{background:var(--teal);color:#fff;border-color:var(--teal)}.cc-follow.on::after{content:' ✓'}
.p-bio{font-family:var(--H);font-size:16px;color:var(--mid);line-height:1.6;margin:24px 0 36px;padding-bottom:32px;border-bottom:1px solid var(--rule)}
.arch-h{font-family:var(--C);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink);margin-bottom:20px}
.arch-item{padding:20px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.arch-tag{font-family:var(--C);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.arch-t{font-family:var(--H);font-size:19px;font-weight:700;margin-bottom:6px}
.arch-dek{font-family:var(--S);font-size:14px;color:var(--mid);line-height:1.5}
.empty{padding:48px 0;text-align:center;color:var(--muted);font-family:var(--H);font-size:15px}
</style>
<script src="native-bridge.js"></script>
</head>
<body>

<div class="topbar">
  <div class="tb-logo" onclick="goHome()">Reedefined</div>
  <div style="display:flex;align-items:center;gap:16px">
    <div style="display:flex;gap:6px;align-items:center">
      <button class="lang-btn" data-lang="en" onclick="setLang('en')" style="background:none;border:none;font-family:var(--C);font-size:12px;font-weight:600;cursor:pointer;padding:0;color:var(--mid)">EN</button>
      <span style="color:var(--rule)">/</span>
      <button class="lang-btn" data-lang="de" onclick="setLang('de')" style="background:none;border:none;font-family:var(--C);font-size:12px;font-weight:600;cursor:pointer;padding:0;color:var(--mid)">DE</button>
      <span style="color:var(--rule)">/</span>
      <button class="lang-btn" data-lang="tr" onclick="setLang('tr')" style="background:none;border:none;font-family:var(--C);font-size:12px;font-weight:600;cursor:pointer;padding:0;color:var(--mid)">TR</button>
    </div>
    <div class="tb-back" onclick="location.href='discover.html'" data-i18n="profile.back_discover">← Back to Discover</div>
    <div id="nav-r-logged-in" style="display:none;position:relative">
      <div class="nav-av" id="nav-av" onclick="toggleNavAvMenu()"></div>
      <div id="nav-av-menu" class="profile-menu" style="display:none;position:absolute;top:40px;right:0;z-index:300">
        <button id="nav-av-myprofile" class="profile-menu-item" onclick="location.href='profile.html?id='" data-i18n="disc.my_profile">My Profile</button>
        <button id="nav-av-dashboard" class="profile-menu-item" style="display:none" onclick="location.href='dashboard.html'" data-i18n="ep.my_dashboard">My Dashboard</button>
        <button class="profile-menu-item" onclick="location.href='profile-edit.html'" data-i18n="ep.edit_profile">Edit Profile</button>
        <button class="profile-menu-item danger" onclick="window.__sbSignOut&&window.__sbSignOut()" data-i18n="ep.sign_out">Sign Out</button>
      </div>
    </div>
  </div>
</div>

<div class="wrap" id="wrap">
  <div class="empty" data-i18n="profile.loading">Loading profile…</div>
</div>

<script>
const sb = supabase.createClient('https://gseuejqqwkdjkhxfxxwy.supabase.co','sb_publishable_0Nmw1mwGx__b_jJHLHBDKg__1OAsRuy',{auth:{storage:window.REEDEFINED_AUTH_STORAGE}});

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// For href/src attribute values: escapes AND only allows http(s) URLs, so a
// user-submitted "javascript:" (or similar) URL can never end up live.
function safeUrl(u){ const s=(u||'').toString().trim(); return /^https?:\/\//i.test(s) ? esc(s) : ''; }

async function loadProfile(){
  const params = new URLSearchParams(location.search);
  const uid = params.get('id');
  const wrap = document.getElementById('wrap');

  if(!uid){ wrap.innerHTML = '<div class="empty">No profile specified.</div>'; return; }

  const { data:p, error } = await sb.from('profiles').select('name,avatar,bio,interests,location,role').eq('id', uid).single();
  if(error || !p){ wrap.innerHTML = '<div class="empty">This profile could not be found.</div>'; return; }

  const { data:subs } = await sb.from('contributions').select('id,title,tagline,category,updated_at').eq('user_id', uid).eq('status','submitted').order('updated_at', { ascending:false });

  const { data:{ session } } = await sb.auth.getSession();
  const showFollowBtn = p.role === 'contrib' && (!session || session.user.id !== uid);
  let isFollowing = false;
  if(showFollowBtn && session){
    const { data:followRow } = await sb.from('follows').select('contributor_id').eq('user_id', session.user.id).eq('contributor_id', uid).maybeSingle();
    isFollowing = !!followRow;
  }

  const name = p.name || 'Contributor';
  const initial = name.charAt(0).toUpperCase();
  const avatarHtml = p.avatar
    ? `<img class="avatar" src="${safeUrl(p.avatar)}" alt="${esc(name)}" onerror="this.outerHTML='<div class=&quot;avatar&quot;>${initial}</div>'">`
    : `<div class="avatar">${initial}</div>`;

  const beats = p.interests
    ? p.interests.split(',').map(s=>s.trim()).filter(Boolean)
    : [...new Set((subs||[]).map(s=>s.category).filter(Boolean))].map(tCat);
  const beatsHtml = beats.length ? beats.slice(0,4).map(esc).join(' · ') : '';
  const metaParts = [];
  if(beatsHtml) metaParts.push(beatsHtml);
  if(p.location) metaParts.push(esc(p.location));
  const metaHtml = metaParts.join(' &nbsp;·&nbsp; ');

  const archiveHtml = (subs && subs.length)
    ? subs.map(s => `
        <div class="arch-item" onclick="location.href='article.html?id=${s.id}'">
          <div class="arch-tag">${esc(tCat(s.category) || 'Column')}</div>
          <div class="arch-t">${esc(s.title||'Untitled')}</div>
          ${s.tagline ? `<div class="arch-dek">${esc(s.tagline)}</div>` : ''}
        </div>`).join('')
    : `<div class="empty">${t('profile.empty')}</div>`;

  wrap.innerHTML = `
    <div class="profile-hd">
      ${avatarHtml}
      <div>
        <div class="p-name">${esc(name)}</div>
        ${metaHtml ? `<div class="p-beats">${metaHtml}</div>` : ''}
      </div>
      ${showFollowBtn ? `<button class="cc-follow${isFollowing?' on':''}" onclick="toggleFollowById('${uid}',this)">${isFollowing?tUp('disc.following'):tUp('disc.follow')}</button>` : ''}
    </div>
    ${p.bio ? `<div class="p-bio">${esc(p.bio)}</div>` : ''}
    <div class="arch-h">${t('profile.archive')}</div>
    ${archiveHtml}
  `;
}

async function toggleFollowById(id, btn){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.href='portal.html'; return; }

  const isOn = btn.classList.contains('on');
  if(isOn){
    btn.classList.remove('on');
    btn.textContent = tUp('disc.follow');
    const { error } = await sb.from('follows').delete().eq('user_id', session.user.id).eq('contributor_id', id);
    if(error){
      console.error('Unfollow failed:', error);
      btn.classList.add('on'); btn.textContent = tUp('disc.following');
      alert('Could not unfollow: ' + error.message);
    }
  } else {
    btn.classList.add('on');
    btn.textContent = tUp('disc.following');
    const { error } = await sb.from('follows').insert({ user_id: session.user.id, contributor_id: id });
    if(error){
      console.error('Follow failed:', error);
      btn.classList.remove('on'); btn.textContent = tUp('disc.follow');
      alert('Could not follow: ' + error.message);
    } else {
      notifyFollow(id, session);
    }
  }
}

async function notifyFollow(contributorId, session){
  const { data:profile } = await sb.from('profiles')
    .select('notify_follows_inapp,notify_follows_email')
    .eq('id', contributorId).single();
  if(!profile) return;

  if(profile.notify_follows_inapp !== false){
    await sb.from('notifications').insert({ user_id: contributorId, actor_id: session.user.id, type: 'follow' });
  }

  if(profile.notify_follows_email === true){
    const actorName = session.user.user_metadata?.full_name || 'A reader';
    try{
      await sb.functions.invoke('send-notification', {
        body: {
          userId: contributorId,
          subject: `${actorName} started following you on Reedefined`,
          message: `<strong>${actorName}</strong> started following you on Reedefined.`,
          ctaText: 'View Profile',
          ctaUrl: `https://reedefined.app/profile.html?id=${session.user.id}`
        }
      });
    }catch(e){ console.error('Follow notification email failed:', e); }
  }
}

loadProfile();

// ── NAV AVATAR / SIGN OUT ──
(async()=>{
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return;
  const name = session.user?.user_metadata?.full_name || session.user?.email || '';
  const role = session.user?.user_metadata?.role || 'reader';
  const av = document.getElementById('nav-av');
  const navInitial = name.charAt(0).toUpperCase();
  if(av && navInitial) av.textContent = navInitial;
  if(av){
    const escInitial = (navInitial||'').replace(/'/g,'&#39;');
    sb.from('profiles').select('avatar').eq('id', session.user.id).single().then(({data:navProfile}) => {
      const src = /^https?:\/\//i.test(navProfile?.avatar||'') ? navProfile.avatar.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
      if(src) av.innerHTML = `<img src="${src}" alt="Profile photo" style="width:100%;height:100%;border-radius:50%;object-fit:cover" onerror="this.parentElement.textContent='${escInitial}'">`;
    });
  }
  const inEl = document.getElementById('nav-r-logged-in');
  if(inEl) inEl.style.display = '';
  const myProfileBtn = document.getElementById('nav-av-myprofile');
  if(myProfileBtn) myProfileBtn.setAttribute('onclick', `location.href='profile.html?id=${session.user.id}'`);
  if(role==='contrib'){
    const dashBtn = document.getElementById('nav-av-dashboard');
    if(dashBtn) dashBtn.style.display = '';
  }
  window.__sbSignOut = async()=>{ await sb.auth.signOut(); location.href='index.html'; };
})();

function toggleNavAvMenu(){
  const menu = document.getElementById('nav-av-menu');
  if(menu) menu.style.display = menu.style.display==='none' ? 'block' : 'none';
}
document.addEventListener('click', e=>{
  const menu = document.getElementById('nav-av-menu');
  const av = document.getElementById('nav-av');
  if(menu && av && !av.contains(e.target) && !menu.contains(e.target)){
    menu.style.display = 'none';
  }
});
</script>

</body>
</html>
