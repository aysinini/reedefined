<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reedefined — Article</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="session-storage.js"></script>
<script src="i18n.js"></script>
<style>
:root{
  --ink:#0C0C0C;--mid:#3A3A3A;--muted:#4A4A4A;--light:#6B6B6B;
  --rule:#E2E2E2;--bg:#F8F7F4;--white:#FFF;
  --teal:#4A7C3F;--teal-l:#D4DBCA;
  --H:'Libre Baskerville',Georgia,serif;
  --B:'Source Serif 4',Georgia,serif;
  --C:'Barlow Condensed',sans-serif;
  --S:'Barlow',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--S);min-height:100vh;-webkit-font-smoothing:antialiased}
.topbar{border-bottom:3px solid var(--ink);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;background:var(--white)}
.tb-logo{font-family:var(--H);font-size:20px;font-weight:400;cursor:pointer;letter-spacing:.08em}
.tb-actions{display:flex;align-items:center;gap:18px}
.tb-link{font-family:var(--C);font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mid);cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:56px 24px 100px}
.a-tag{font-family:var(--C);font-size:15px;font-weight:700;letter-spacing:1.5px;font-variant:small-caps;color:var(--teal);margin-bottom:14px}
.a-title{font-family:var(--H);font-size:36px;font-weight:400;line-height:1.3;margin-bottom:26px;letter-spacing:.06em}
.a-tagline{font-family:var(--H);font-style:italic;font-size:19px;color:var(--mid);line-height:1.5;margin-bottom:28px}
.a-byline{display:flex;align-items:center;gap:14px;padding:20px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:36px;cursor:pointer}
.a-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--teal-l);display:flex;align-items:center;justify-content:center;font-family:var(--H);font-size:16px;color:var(--teal);flex-shrink:0}
.a-byname{font-family:var(--H);font-size:15px;font-weight:700}
.a-bydate{font-family:var(--C);font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.a-translate-cta{font-family:var(--C);font-size:12px;letter-spacing:.5px;color:var(--muted);margin-bottom:24px}
.a-translate-cta a{color:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.a-body{font-family:var(--B);font-size:18px;line-height:1.7;color:var(--ink);white-space:pre-wrap}
.a-body p{margin-bottom:22px}
.a-body a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.a-body p:first-of-type::first-letter{
  font-family:var(--H);
  font-weight:700;
  font-size:4.2em;
  line-height:.72;
  float:left;
  padding-right:10px;
  padding-top:6px;
  color:var(--ink);
}
.empty{padding:80px 0;text-align:center;color:var(--muted);font-family:var(--H);font-size:15px}

/* ── SHOP THE ISSUE ── */
.shop-box{margin:36px 0;padding-top:28px;border-top:1px solid var(--rule)}
.shop-label{font-family:var(--C);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--teal);margin-bottom:16px}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shop-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--rule);border-radius:8px;text-decoration:none;color:inherit;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.shop-item:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.06);border-color:var(--teal)}
.shop-item-img{width:52px;height:52px;object-fit:cover;border-radius:6px;flex-shrink:0;background:var(--teal-l)}
.shop-item-info{flex:1;min-width:0}
.shop-item-name{font-family:var(--S);font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop-item-meta{display:flex;align-items:center;gap:8px;margin-top:4px}
.shop-item-price{font-family:var(--H);font-size:13px;font-weight:700;color:var(--ink)}
.shop-item-platform{font-family:var(--C);font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--mid);background:var(--bg);padding:2px 8px;border-radius:10px}
.shop-item-buy{font-family:var(--C);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--teal);flex-shrink:0}
@media(max-width:520px){.shop-grid{grid-template-columns:1fr}}

/* ── LIKE ── */
.engage-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:28px 0;margin-top:8px;border-top:1px solid var(--rule)}
.like-btn{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--rule);border-radius:20px;padding:9px 18px;cursor:pointer;font-family:var(--C);font-size:14px;font-weight:600;color:var(--mid);transition:all .15s}
.like-btn:hover{border-color:var(--ink)}
.like-btn.on{background:#FBEAE8;border-color:#E4A199;color:#C8251A}
.like-btn svg{width:16px;height:16px}

/* ── REPORT ── */
.report-link{display:flex;align-items:center;gap:6px;background:none;border:none;font-family:var(--C);font-size:12px;font-weight:600;letter-spacing:.3px;color:var(--light);cursor:pointer;padding:0;transition:color .15s}
.report-link:hover{color:var(--muted)}
.report-link svg{width:14px;height:14px}
.report-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center}
.report-overlay.open{display:flex}
.report-card{background:var(--white);width:420px;max-width:calc(100vw - 32px);padding:28px;border-radius:8px}
.report-title{font-family:var(--H);font-size:20px;font-weight:700;margin-bottom:18px}
.report-field{margin-bottom:16px}
.report-label{font-family:var(--C);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:7px}
.report-select,.report-textarea{width:100%;padding:11px 13px;font-family:var(--S);font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:7px;outline:none}
.report-textarea{resize:vertical;min-height:70px}
.report-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.report-cancel{font-family:var(--H);font-size:13px;font-weight:700;padding:9px 18px;border:1px solid var(--rule);background:var(--white);color:var(--muted);cursor:pointer;border-radius:7px}
.report-submit{font-family:var(--H);font-size:13px;font-weight:700;padding:9px 18px;background:var(--ink);color:#fff;border:none;cursor:pointer;border-radius:7px}
.report-thanks{font-family:var(--H);font-size:14px;color:var(--teal);text-align:center;padding:8px 0}

/* ── COMMENTS ── */
.comments-section{margin-top:20px}
.comments-h{font-family:var(--C);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink);margin-bottom:20px}
.comment-form{display:flex;gap:10px;margin-bottom:32px}
.comment-input{flex:1;padding:12px 14px;border:1px solid var(--rule);border-radius:20px;font-family:var(--S);font-size:14px;color:var(--ink)}
.comment-submit{font-family:var(--C);font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:var(--ink);color:#fff;border:none;border-radius:20px;padding:0 22px;cursor:pointer}
.comment-item{display:flex;gap:12px;padding:16px 0;border-top:1px solid var(--rule)}
.comment-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--teal-l);display:flex;align-items:center;justify-content:center;font-family:var(--H);font-size:13px;color:var(--teal);flex-shrink:0}
.comment-name{font-family:var(--H);font-size:14px;font-weight:700}
.comment-date{font-family:var(--C);font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-left:8px}
.comment-body{font-family:var(--S);font-size:14px;color:var(--mid);line-height:1.5;margin-top:4px}
.comments-empty{padding:24px 0;color:var(--muted);font-family:var(--H);font-size:14px;text-align:center}
.comment-actions{display:flex;gap:14px;margin-top:6px}
.comment-action{font-family:var(--C);font-size:12px;font-weight:600;letter-spacing:.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.comment-action.delete{color:#C0392B}
.reply-form{display:flex;gap:8px;margin-top:10px}
.reply-input{flex:1;padding:9px 12px;border:1px solid var(--rule);border-radius:16px;font-family:var(--S);font-size:13px;color:var(--ink)}
.reply-submit{font-family:var(--C);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:var(--ink);color:#fff;border:none;border-radius:16px;padding:0 16px;cursor:pointer}
.comment-replies{margin-top:14px;display:flex;flex-direction:column;gap:14px}
.reply-item{display:flex;gap:10px}
.reply-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--teal-l);display:flex;align-items:center;justify-content:center;font-family:var(--H);font-size:11px;color:var(--teal);flex-shrink:0}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-logo" onclick="goHome()">Reedefined</div>
  <div class="tb-actions">
    <div style="display:flex;gap:6px;align-items:center;margin-right:8px">
      <button class="lang-btn" data-lang="en" onclick="setLang('en')" style="background:none;border:none;font-family:var(--C);font-size:12px;font-weight:600;cursor:pointer;padding:0;color:var(--mid)">EN</button>
      <span style="color:var(--rule)">/</span>
      <button class="lang-btn" data-lang="de" onclick="setLang('de')" style="background:none;border:none;font-family:var(--C);font-size:12px;font-weight:600;cursor:pointer;padding:0;color:var(--mid)">DE</button>
    </div>
    <div class="tb-link" data-i18n="art.flip" onclick="goFlipReader()">Read in flip format ⇄</div>
    <div class="tb-link" data-i18n="art.back" onclick="location.href='newsstand.html'">← Back</div>
  </div>
</div>

<div class="wrap" id="wrap">
  <div class="empty" data-i18n="art.loading">Loading article…</div>
</div>

<div class="report-overlay" id="report-overlay">
  <div class="report-card">
    <div class="report-title" data-i18n="art.report_title">Report this article</div>
    <div id="report-form-body">
      <div class="report-field">
        <label class="report-label" data-i18n="art.report_reason">Reason</label>
        <select class="report-select" id="report-reason">
          <option data-i18n="art.reason_inappropriate">Inappropriate content</option>
          <option data-i18n="art.reason_incorrect">Incorrect information</option>
          <option data-i18n="art.reason_copyright">Copyright infringement</option>
          <option data-i18n="art.reason_other">Other</option>
        </select>
      </div>
      <div class="report-field">
        <label class="report-label" data-i18n="art.report_details">Additional details (optional)</label>
        <textarea class="report-textarea" id="report-note" placeholder="Anything else we should know?" data-i18n-placeholder="art.report_note_ph"></textarea>
      </div>
    </div>
    <div class="report-acts" id="report-acts">
      <button class="report-cancel" onclick="closeReportModal()" data-i18n="ep.cancel">Cancel</button>
      <button class="report-submit" onclick="submitReport()" data-i18n="art.report_submit">Submit report</button>
    </div>
  </div>
</div>

<script>
const sb = supabase.createClient('https://gseuejqqwkdjkhxfxxwy.supabase.co','sb_publishable_0Nmw1mwGx__b_jJHLHBDKg__1OAsRuy',{auth:{storage:window.REEDEFINED_AUTH_STORAGE}});

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// For href/src attribute values: escapes AND only allows http(s) URLs, so a
// contributor-submitted "javascript:" (or similar) URL can never end up live.
function safeUrl(u){ const s=(u||'').toString().trim(); return /^https?:\/\//i.test(s) ? esc(s) : ''; }

function goFlipReader(){
  location.href = CURRENT_ARTICLE ? `magazine-reader.html?article=${CURRENT_ARTICLE.id}` : 'magazine-reader.html';
}

// Turns the [label](https://…) markdown-style syntax contributors can add via
// the editor's text-selection "Link" button into a real anchor tag. Runs on
// already-escaped text, so no raw HTML from the article body can slip through.
function renderInlineLinks(escapedText){
  return escapedText.replace(/\[([^\[\]]+)\]\((https?:\/\/[^\s()]+)\)/g,
    (m, label, url) => `<a href="${url}" target="_blank" rel="noopener">${label}</a>`);
}

let CURRENT_ARTICLE = null;
let translationsCache = {}; // { tr: {title,tagline,body}, de: {...} } — from contributions.translations
let activeTranslationLang = null; // null = showing original, 'tr'|'de' = showing that translation

async function loadArticle(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const isPreview = params.get('preview') === '1';
  const wrap = document.getElementById('wrap');

  if(!id){ wrap.innerHTML = '<div class="empty">No article specified.</div>'; return; }

  let query = sb.from('contributions')
    .select('id,title,tagline,category,body,photos,videos,products,translations,updated_at,user_id,profiles:user_id(name,avatar)')
    .eq('id', id);
  if(!isPreview) query = query.eq('status','submitted');

  const { data:a, error } = await query.single();

  if(error || !a){ wrap.innerHTML = '<div class="empty">This article could not be found.</div>'; return; }

  const { data:{ session } } = await sb.auth.getSession();

  if(isPreview && (!session || a.user_id !== session.user.id)){
    wrap.innerHTML = '<div class="empty">You do not have permission to preview this draft.</div>';
    return;
  }

  CURRENT_ARTICLE = a;
  activeTranslationLang = null;
  try{ translationsCache = JSON.parse(a.translations || '{}'); }catch(e){ translationsCache = {}; }

  const name = a.profiles?.name || 'Contributor';
  const initial = name.charAt(0).toUpperCase();
  const avatarHtml = a.profiles?.avatar
    ? `<img class="a-avatar" src="${safeUrl(a.profiles.avatar)}" alt="${esc(name)}">`
    : `<div class="a-avatar">${initial}</div>`;
  const date = a.updated_at ? new Date(a.updated_at).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : '';
  const paragraphs = (a.body || '').split(/\n\s*\n/).map(p => `<p>${renderInlineLinks(esc(p))}</p>`).join('');

  let photoArr = [], videoArr = [], productArr = [];
  try{ photoArr = JSON.parse(a.photos||'[]'); }catch(e){}
  try{ videoArr = JSON.parse(a.videos||'[]'); }catch(e){}
  try{ productArr = JSON.parse(a.products||'[]'); }catch(e){}

  const photosHtml = photoArr.map(p => `
    <figure style="margin:28px 0">
      <img src="${safeUrl(p.url)}" alt="${esc(p.caption || 'Article photo')}" style="width:100%;border-radius:8px;display:block">
      ${p.caption ? `<figcaption style="font-family:var(--S);font-size:13px;color:var(--muted);margin-top:8px">${esc(p.caption)}</figcaption>` : ''}
    </figure>`).join('');

  const videosHtml = videoArr.map(v => `
    <div style="position:relative;padding-top:56.25%;border-radius:8px;overflow:hidden;background:#000;margin:28px 0">
      <iframe src="${safeUrl(v.embedUrl)}" style="position:absolute;inset:0;width:100%;height:100%;border:none" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>
    </div>`).join('');

  const shopHtml = productArr.length === 0 ? '' : `
    <div class="shop-box">
      <div class="shop-label" data-i18n="art.shop_issue">Shop the Issue</div>
      <div class="shop-grid">
        ${productArr.map(p => `
          <a class="shop-item" href="${safeUrl(p.url) || '#'}" target="_blank" rel="noopener">
            ${p.img
              ? `<img class="shop-item-img" src="${safeUrl(p.img)}" alt="${esc(p.name || 'Product')}">`
              : `<div class="shop-item-img"></div>`}
            <div class="shop-item-info">
              <div class="shop-item-name">${esc(p.name || '')}</div>
              <div class="shop-item-meta">
                ${p.price ? `<span class="shop-item-price">${esc(p.price)}</span>` : ''}
                ${p.platform ? `<span class="shop-item-platform">${esc(p.platform)}</span>` : ''}
              </div>
            </div>
            <span class="shop-item-buy" data-i18n="art.buy">Buy →</span>
          </a>`).join('')}
      </div>
    </div>`;

  wrap.innerHTML = `
    <div class="a-tag" id="a-tag">${esc(a.category || 'Column')}</div>
    <div class="a-title" id="a-title">${esc(a.title || 'Untitled')}</div>
    <div class="a-tagline" id="a-tagline" style="${a.tagline ? '' : 'display:none'}">"${esc(a.tagline||'')}"</div>
    <div class="a-byline" onclick="location.href='profile.html?id=${a.user_id}'">
      ${avatarHtml}
      <div>
        <div class="a-byname">${esc(name)}</div>
        <div class="a-bydate">${date}</div>
      </div>
    </div>
    <div id="a-translate-cta" class="a-translate-cta"></div>
    <div class="a-body" id="a-body">${paragraphs}</div>
    ${photosHtml}
    ${videosHtml}
    ${shopHtml}

    <div class="engage-row">
      <button class="like-btn" id="like-btn" onclick="toggleLike(${a.id})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6z"/></svg>
        <span id="like-count">–</span>
      </button>
      <button class="report-link" onclick="openReportModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v18M4 4h13l-2 4 2 4H4"/></svg>
        <span data-i18n="art.report_title">Report this article</span>
      </button>
    </div>

    <div class="comments-section">
      <div class="comments-h" data-i18n="art.comments">Comments</div>
      <div id="comment-form-wrap"></div>
      <div id="comments-list"><div class="comments-empty">Loading comments…</div></div>
    </div>
  `;

  applyLang(getLang());
  renderTranslateCta();

  loadLikes(a.id, session);
  loadComments(a.id, session);
  renderCommentForm(a.id, session);
}

async function loadLikes(contributionId, session){
  const { count } = await sb.from('likes').select('id',{count:'exact',head:true}).eq('contribution_id', contributionId);
  document.getElementById('like-count').textContent = count || 0;

  if(session){
    const { data:mine } = await sb.from('likes').select('id').eq('contribution_id', contributionId).eq('user_id', session.user.id).maybeSingle();
    if(mine) document.getElementById('like-btn').classList.add('on');
  }
}

async function notifyAuthor(contributionId, type, commentBody){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return;

  const { data:contrib } = await sb.from('contributions').select('user_id,title').eq('id', contributionId).single();
  if(!contrib || contrib.user_id === session.user.id) return; // don't notify yourself

  const { data:authorProfile } = await sb.from('profiles')
    .select('notify_likes_inapp,notify_likes_email,notify_comments_inapp,notify_comments_email')
    .eq('id', contrib.user_id).single();
  if(!authorProfile) return;

  const wantsInapp = type === 'like' ? authorProfile.notify_likes_inapp !== false : authorProfile.notify_comments_inapp !== false;
  const wantsEmail = type === 'like' ? authorProfile.notify_likes_email === true : authorProfile.notify_comments_email === true;

  if(wantsInapp){
    await sb.from('notifications').insert({
      user_id: contrib.user_id,
      actor_id: session.user.id,
      type,
      contribution_id: contributionId,
      comment_body: type === 'comment' ? commentBody : null
    });
  }

  if(wantsEmail){
    const actorName = session.user.user_metadata?.full_name || 'A reader';
    const subject = type === 'like'
      ? `${actorName} liked your column "${contrib.title}"`
      : `${actorName} commented on your column "${contrib.title}"`;
    const message = type === 'like'
      ? `${actorName} liked your column, <strong>${esc(contrib.title)}</strong>, on Reedefined.`
      : `${actorName} commented on your column, <strong>${esc(contrib.title)}</strong>:<br><br>"${esc(commentBody)}"`;
    try{
      await sb.functions.invoke('send-notification', { body: { userId: contrib.user_id, subject, message } });
    }catch(e){ console.error('Notification email failed:', e); }
  }
}

async function toggleLike(contributionId){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.href='portal.html'; return; }

  const btn = document.getElementById('like-btn');
  const countEl = document.getElementById('like-count');
  const isOn = btn.classList.contains('on');

  if(isOn){
    await sb.from('likes').delete().eq('contribution_id', contributionId).eq('user_id', session.user.id);
    btn.classList.remove('on');
    countEl.textContent = Math.max(0, parseInt(countEl.textContent||'0') - 1);
  } else {
    await sb.from('likes').insert({ contribution_id: contributionId, user_id: session.user.id });
    btn.classList.add('on');
    countEl.textContent = parseInt(countEl.textContent||'0') + 1;
    notifyAuthor(contributionId, 'like');
  }
}

async function openReportModal(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.href='portal.html'; return; }

  document.getElementById('report-form-body').style.display = '';
  document.getElementById('report-reason').value = 'Inappropriate content';
  document.getElementById('report-note').value = '';
  document.getElementById('report-acts').innerHTML =
    `<button class="report-cancel" onclick="closeReportModal()">${t('ep.cancel')}</button>` +
    `<button class="report-submit" onclick="submitReport()">${t('art.report_submit')}</button>`;
  document.getElementById('report-overlay').classList.add('open');
}

function closeReportModal(){
  document.getElementById('report-overlay').classList.remove('open');
}

async function submitReport(){
  if(!CURRENT_ARTICLE) return;
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.href='portal.html'; return; }

  const reason = document.getElementById('report-reason').value;
  const note = document.getElementById('report-note').value.trim();

  const { error } = await sb.from('reports').insert({
    article_id: CURRENT_ARTICLE.id,
    reporter_id: session.user.id,
    reason,
    note: note || null
  });

  if(error){
    console.error('Report submit error:', error);
    alert('Could not submit report: ' + (error.message || 'unknown error'));
    return;
  }

  document.getElementById('report-form-body').style.display = 'none';
  document.getElementById('report-acts').innerHTML = `<div class="report-thanks">${t('art.report_thanks')}</div>`;
  setTimeout(closeReportModal, 1800);
}

document.getElementById('report-overlay').addEventListener('click', function(e){
  if(e.target === this) closeReportModal();
});

function avatarHtmlFor(c, sizeClass){
  const name = c.profiles?.name || 'Reader';
  const initial = name.charAt(0).toUpperCase();
  const hasAvatar = c.profiles?.avatar && c.profiles.avatar.trim().length > 0;
  return hasAvatar
    ? `<img class="${sizeClass}" src="${c.profiles.avatar}" alt="${esc(name)}" onerror="this.outerHTML='<div class=\\'${sizeClass}\\'>${initial}</div>'">`
    : `<div class="${sizeClass}">${initial}</div>`;
}

function canDeleteComment(c, session){
  if(!session) return false;
  if(c.user_id === session.user.id) return true;
  if(CURRENT_ARTICLE && CURRENT_ARTICLE.user_id === session.user.id) return true;
  return false;
}

function renderReply(r, contributionId, session){
  const name = r.profiles?.name || 'Reader';
  const date = r.created_at ? new Date(r.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
  const canDelete = canDeleteComment(r, session);
  return `
      <div class="reply-item" id="comment-${r.id}">
        ${avatarHtmlFor(r, 'reply-avatar')}
        <div style="flex:1">
          <span class="comment-name">${esc(name)}</span><span class="comment-date">${date}</span>
          <div class="comment-body">${esc(r.body)}</div>
          ${canDelete ? `<div class="comment-actions"><span class="comment-action delete" onclick="deleteComment(${r.id},${contributionId})">${t('art.delete')}</span></div>` : ''}
        </div>
      </div>`;
}

async function loadComments(contributionId, session){
  const { data:comments, error } = await sb.from('comments')
    .select('id,body,created_at,user_id,parent_comment_id,profiles:user_id(name,avatar)')
    .eq('contribution_id', contributionId).order('created_at',{ascending:true});

  const list = document.getElementById('comments-list');
  if(error){ console.error('Failed to load comments:', error); list.innerHTML = `<div class="comments-empty">${t('art.no_comments')}</div>`; return; }
  if(!comments || comments.length===0){ list.innerHTML = `<div class="comments-empty">${t('art.no_comments')}</div>`; return; }

  const topLevel = comments.filter(c => !c.parent_comment_id);
  const repliesByParent = {};
  comments.filter(c => c.parent_comment_id).forEach(c => {
    (repliesByParent[c.parent_comment_id] = repliesByParent[c.parent_comment_id] || []).push(c);
  });

  list.innerHTML = topLevel.map(c => {
    const name = c.profiles?.name || 'Reader';
    const date = c.created_at ? new Date(c.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
    const canDelete = canDeleteComment(c, session);
    const replies = repliesByParent[c.id] || [];
    const repliesHtml = replies.length
      ? `<div class="comment-replies">${replies.map(r => renderReply(r, contributionId, session)).join('')}</div>`
      : '';
    const replyAction = session ? `<span class="comment-action" onclick="toggleReplyForm(${c.id})">${t('art.reply')}</span>` : '';
    return `
      <div class="comment-item" id="comment-${c.id}">
        ${avatarHtmlFor(c, 'comment-avatar')}
        <div style="flex:1">
          <span class="comment-name">${esc(name)}</span><span class="comment-date">${date}</span>
          <div class="comment-body">${esc(c.body)}</div>
          <div class="comment-actions">
            ${replyAction}
            ${canDelete ? `<span class="comment-action delete" onclick="deleteComment(${c.id},${contributionId})">${t('art.delete')}</span>` : ''}
          </div>
          <div class="reply-form" id="reply-form-${c.id}" style="display:none">
            <input class="reply-input" id="reply-input-${c.id}" placeholder="${t('art.reply_ph')}" maxlength="500">
            <button class="reply-submit" onclick="submitReply(${c.id},${contributionId})">${t('art.post')}</button>
          </div>
          ${repliesHtml}
        </div>
      </div>`;
  }).join('');
}

function toggleReplyForm(commentId){
  const form = document.getElementById(`reply-form-${commentId}`);
  if(!form) return;
  const showing = form.style.display !== 'none';
  form.style.display = showing ? 'none' : 'flex';
  if(!showing) document.getElementById(`reply-input-${commentId}`).focus();
}

async function submitReply(parentId, contributionId){
  const input = document.getElementById(`reply-input-${parentId}`);
  const body = input.value.trim();
  if(!body) return;

  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.href='portal.html'; return; }

  const { error } = await sb.from('comments').insert({ contribution_id: contributionId, user_id: session.user.id, body, parent_comment_id: parentId });
  if(!error){
    input.value = '';
    loadComments(contributionId, session);
    notifyAuthor(contributionId, 'comment', body);
  } else {
    console.error('Reply submit error:', error);
    alert('Could not post reply: ' + (error.message || 'unknown error'));
  }
}

async function deleteComment(commentId, contributionId){
  if(!confirm('Delete this comment?')) return;
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return;

  const { error } = await sb.from('comments').delete().eq('id', commentId);
  if(error){ alert('Could not delete comment: ' + (error.message || 'unknown error')); return; }
  loadComments(contributionId, session);
}

function renderCommentForm(contributionId, session){
  const wrap = document.getElementById('comment-form-wrap');
  if(!session){
    wrap.innerHTML = `<div class="comments-empty" style="cursor:pointer" onclick="location.href='portal.html'">${t('art.sign_comment')}</div>`;
    return;
  }
  wrap.innerHTML = `
    <div class="comment-form">
      <input class="comment-input" id="new-comment-input" placeholder="${t('art.add_comment')}" maxlength="500">
      <button class="comment-submit" onclick="submitComment(${contributionId})">${t('art.post')}</button>
    </div>`;
  document.getElementById('new-comment-input').addEventListener('keydown', e=>{
    if(e.key==='Enter') submitComment(contributionId);
  });
}

async function submitComment(contributionId){
  const input = document.getElementById('new-comment-input');
  const body = input.value.trim();
  if(!body) return;

  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.href='portal.html'; return; }

  const { error } = await sb.from('comments').insert({ contribution_id: contributionId, user_id: session.user.id, body });
  if(!error){
    input.value = '';
    loadComments(contributionId, session);
    notifyAuthor(contributionId, 'comment', body);
  } else {
    console.error('Comment submit error:', error);
    alert('Could not post comment: ' + (error.message || 'unknown error'));
  }
}

const TRANSLATE_LANGS = ['en', 'tr', 'de'];
const TRANSLATE_LANG_LABEL = { en: 'English', tr: 'Türkçe', de: 'Deutsch' };

function renderTranslateCta(){
  const cta = document.getElementById('a-translate-cta');
  if(!cta) return;
  if(activeTranslationLang){
    const others = TRANSLATE_LANGS.filter(l => l !== activeTranslationLang);
    cta.innerHTML = `Showing the ${TRANSLATE_LANG_LABEL[activeTranslationLang]} translation — ` +
      `<a onclick="showOriginalArticle()">Show original</a> · ` +
      others.map(l => `<a onclick="translateArticleTo('${l}')">${TRANSLATE_LANG_LABEL[l]}</a>`).join(' · ');
  } else {
    cta.innerHTML = `Translate this column: ` +
      TRANSLATE_LANGS.map(l => `<a onclick="translateArticleTo('${l}')">${TRANSLATE_LANG_LABEL[l]}</a>`).join(' · ');
  }
}

function setTranslateCtaLoading(){
  const cta = document.getElementById('a-translate-cta');
  if(cta) cta.textContent = 'Translating…';
}

async function translateArticleTo(lang){
  const titleEl = document.getElementById('a-title');
  const bodyEl = document.getElementById('a-body');
  if(!titleEl || !bodyEl || !CURRENT_ARTICLE) return;

  if(translationsCache[lang]){
    applyTranslation(translationsCache[lang], lang);
    return;
  }

  setTranslateCtaLoading();
  try{
    const { data, error } = await sb.functions.invoke('translate-article', {
      body: { contributionId: CURRENT_ARTICLE.id, title: CURRENT_ARTICLE.title, tagline: CURRENT_ARTICLE.tagline, body: CURRENT_ARTICLE.body, lang }
    });
    if(error || !data || data.error) throw new Error(data?.error || error?.message || 'translation failed');
    translationsCache[lang] = data;
    applyTranslation(data, lang);
  }catch(e){
    console.error('Article translation failed:', e);
    const cta = document.getElementById('a-translate-cta');
    if(cta) cta.textContent = 'Translation failed — please try again.';
    setTimeout(renderTranslateCta, 2500); // revert CTA back to the language options after showing the error
  }
}

function applyTranslation(data, lang){
  document.getElementById('a-title').textContent = data.title;
  const taglineEl = document.getElementById('a-tagline');
  if(taglineEl){
    taglineEl.textContent = data.tagline ? `"${data.tagline}"` : '';
    taglineEl.style.display = data.tagline ? '' : 'none';
  }
  document.getElementById('a-body').innerHTML = (data.body || '').split(/\n\s*\n/).map(p => `<p>${esc(p)}</p>`).join('');
  activeTranslationLang = lang;
  renderTranslateCta();
}

function showOriginalArticle(){
  if(!CURRENT_ARTICLE) return;
  document.getElementById('a-title').textContent = CURRENT_ARTICLE.title || 'Untitled';
  const taglineEl = document.getElementById('a-tagline');
  if(taglineEl){
    taglineEl.textContent = CURRENT_ARTICLE.tagline ? `"${CURRENT_ARTICLE.tagline}"` : '';
    taglineEl.style.display = CURRENT_ARTICLE.tagline ? '' : 'none';
  }
  document.getElementById('a-body').innerHTML = (CURRENT_ARTICLE.body || '').split(/\n\s*\n/).map(p => `<p>${renderInlineLinks(esc(p))}</p>`).join('');
  activeTranslationLang = null;
  renderTranslateCta();
}

loadArticle();
</script>
